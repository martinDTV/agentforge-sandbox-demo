[project]
name = "mailcheck"
version = "0.1.0"
description = "Proyecto desechable para la primera ejecución Developer + QA de AgentForge"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
